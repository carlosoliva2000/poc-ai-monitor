[project]
name = "poc-contracts"
version = "0.4.0"
description = "Contratos de poc-ai-monitor: modelos Pydantic de eventos, WebSocket, API y tools"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
