# E6: la tabla de decisión decide (causa, severidad, confianza, fase y ciclo de vida) y el LLM solo
# añade después una frase de interpretación a cada alerta (`monitor.engine: hybrid`). El resto es
# `actual`. Ficha: https://huggingface.co/Qwen/Qwen3-14B-AWQ
description: la tabla decide y el LLM enriquece el texto; informe y chats como actual
server:
  model: Qwen/Qwen3-14B-AWQ
  tool_call_parser: hermes
  reasoning_parser: qwen3
  max_model_len: 32768
  extra_args: []
agents:
  monitor:
    engine: hybrid
