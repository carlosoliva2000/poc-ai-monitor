# Perfil por defecto: Qwen3-14B-AWQ sin razonamiento. serve.sh solo lee la sección `server`.
# Ficha: https://huggingface.co/Qwen/Qwen3-14B-AWQ
description: Qwen/Qwen3-14B-AWQ, sin razonamiento, el modelo por defecto del asistente
server:
  model: Qwen/Qwen3-14B-AWQ
  tool_call_parser: hermes
  reasoning_parser: qwen3    # el razonamiento queda activado en el servidor; cada petición lo apaga
  max_model_len: 32768
  extra_args: []
