# 262144, aquí 32768. Sin razonamiento (la variante «Reasoning» no se prueba).
# Ficha: https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512
description: mistralai/Ministral-3-14B-Instruct-2512, sin razonamiento, sin visión
server:
  model: mistralai/Ministral-3-14B-Instruct-2512
  tool_call_parser: mistral
  reasoning_parser: null
