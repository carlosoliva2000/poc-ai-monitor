# Idéntico a `actual` (Qwen3-14B-AWQ sin razonamiento, T=0, todas las ayudas) salvo que las ayudas de
# la Fase 15.1 están apagadas: sin tendencia de la ruta en `now`, el `as_of` de la invocación como
# antes (el reloj del módulo), sin las reglas de ventana de los chats ni sus secciones nuevas y sin
# la hora de vuelta del enlace en el informe. Control para comparar la Fase 15.1 con la anterior.
# Ficha: https://huggingface.co/Qwen/Qwen3-14B-AWQ
description: Qwen/Qwen3-14B-AWQ, sin razonamiento, como actual sin las ayudas de la Fase 15.1
server:
  model: Qwen/Qwen3-14B-AWQ
  tool_call_parser: hermes
  reasoning_parser: qwen3
  max_model_len: 32768
  extra_args: []
agents:
  monitor:
    now_route_trend: false
    as_of_from_warning: false
chat:
  alert_phases: false
  monitor_decisions: false
  window_rules: false
report:
  link_back_time: false
