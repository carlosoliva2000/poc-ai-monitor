# Qwen3 sin razonamiento con el muestreo que recomienda Qwen para el modo non-thinking:
# temperature 0.7, top_p 0.8, top_k 20, min_p 0 y, para modelos cuantizados, presence_penalty 1.5
# («We strongly recommend setting this value to 1.5 for quantized models»). repetition_penalty 1.0
# explícito (la ficha no lo recomienda). Ficha (sección Best Practices, consultada el 23/10/2026):
# https://huggingface.co/Qwen/Qwen3-30B-A3B-GPTQ-Int4
description: Qwen/Qwen3-30B-A3B-GPTQ-Int4, sin razonamiento, muestreo de Qwen
server:
  model: Qwen/Qwen3-30B-A3B-GPTQ-Int4
  tool_call_parser: hermes
  reasoning_parser: qwen3    # el razonamiento queda activado en el servidor; cada petición lo enciende o apaga
  max_model_len: 32768
  extra_args: []
sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  presence_penalty: 1.5
  reasoning: false
