# Igual que qwen3-14b-t0 pero con tools en los chats (`chat.tools_enabled: true`): sirve para probar
# y enseñar los desplegables de llamadas a tool de un chat en la web. La demo usa `actual`.
description: Qwen/Qwen3-14B-AWQ, sin razonamiento, muestreo de la PoC y chats con tools
server:
  model: Qwen/Qwen3-14B-AWQ
  tool_call_parser: hermes
  reasoning_parser: qwen3    # el razonamiento queda activado en el servidor; cada petición lo enciende o apaga
  max_model_len: 32768
  extra_args: []
sampling:
  repetition_penalty: 1.05
  reasoning: false
chat:
  tools_enabled: true
