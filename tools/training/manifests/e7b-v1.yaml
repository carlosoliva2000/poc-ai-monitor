# Manifiesto del conjunto de datos de la E7b: de aquí (y de la semilla) sale todo el conjunto.
# Los datos van a experiments/e7b/<dataset>/ (no se versionan); este fichero sí.
dataset: e7b-v1
seed: 7011                 # semilla maestra: de ella y del índice de la variante sale cada variante
n_variants: 2400
split: {train: 0.70, validation: 0.15, test: 0.15}   # por variante, estratificado por familia
max_flight_s: 1100         # una ruta cuyo plan dura más se vuelve a muestrear
min_flight_s: 240          # y una que dura menos
min_episodes: {train: 60, validation: 15, test: 15}  # por estado anómalo (informe de recuentos)

# Cuotas por familia principal (suman 1).
quotas:
  nominal: 0.04
  wind: 0.07
  spoofing: 0.10
  hijack: 0.08
  gps_loss: 0.09
  jamming: 0.07
  gps_degraded: 0.05
  link_degraded: 0.07
  link_mute: 0.12
  source_mute: 0.18          # una o dos fuentes silenciadas (gps, radar, meteo, batería)
  radar_range: 0.05
  battery: 0.08

# Combinaciones: probabilidad de una 2.ª anomalía de otra familia y de una 3.ª; la mitad se
# solapan en el tiempo con la primera.
combine: {second: 0.40, third: 0.10, overlap: 0.5}

# Rangos de muestreo (uniformes salvo que se diga otra cosa).
ranges:
  route: {n_waypoints: [3, 6], radius_m: [500, 3000], min_leg_m: 300}
  drone:                                  # §5 de la especificación
    cruise_speed_mps: [8, 15]
    max_accel_mps2: [2.0, 3.0]
    max_turn_rate_dps: [60, 120]
    lookahead_m: [15, 40]
  gps: {gm_sigma_m: [0.8, 2.5], gm_tau_s: [30, 180], white_sigma_m: [0.1, 0.5], sats: [10, 16], hdop: [0.6, 1.2]}
  radar: {offset_m: [0, 2000], sigma_per_km_m: [1, 4], max_range_m: [3000, 8000]}
  meteo: {factor: [0.7, 0.9], lag_s: [15, 45], sigma_mps: [0.3, 0.8], sigma_deg: [5, 12]}
  link: {rssi_dbm: [-70, -55], latency_ms: [30, 80], weak_rssi_dbm: [-90, -80]}
  battery: {capacity_wh: [300, 500], start_pct: [80, 100], low_capacity_wh: [60, 150], low_start_pct: [20, 60]}
  wind:
    base_speed_mps: [0, 8]
    bands:                                 # [peso, mínimo, máximo] del episodio de la familia `wind`
      notable: [0.15, 5, 12]
      beyond_limit: [0.35, 12, 17]
      drifting: [0.50, 17, 24]
    duration_s: [20, 120]
    ramp_s: [5, 20]
  spoofing: {drift_rate_mps: [0.3, 3.0], duration_s: [30, 120], emitter_offset_m: [300, 2000], emitter_power_db: [8, 16], no_emitter: 0.2}
  hijack: {target_offset_m: [300, 1000], duration_s: [30, 120], open_ended: 0.3}
  jamming: {offset_m: [200, 1200], power_db: [6, 25], duration_s: [60, 160], loss_prob: 0.5, loss_s: [15, 40]}
  gps_degraded: {duration_s: [20, 90], hdop: [3.5, 8.0], sats: [5, 9]}
  link_degraded: {duration_s: [20, 90], latency_ms: [150, 400], rssi_dbm: [-92, -84]}
  fault: {duration_s: [10, 90]}
  link_loss_action: {continue: 0.25, hold: 0.35, return: 0.2, land: 0.2}
