name: demo-meteo
description: >-
  The demo flight (wind, spoofing, hijacking) with the weather station silent from T+00:25 to the end of the mission: without wind data the wind deviation cannot be confirmed. Expected causes: SENSOR_FAULT (weather station), WIND (or UNKNOWN without the station), GPS_SPOOFING and HIJACK.
seed: 42
t0: "2026-10-20T10:00:00Z"
max_duration_s: 900

drone:
  cruise_speed_mps: 15.0
  max_accel_mps2: 2.0
  max_turn_rate_dps: 100.0        # yaw máximo del DJI Matrice 300 RTK
  altitude_m: 60.0
  acceptance_radius_m: 5.0
  lookahead_m: 40.0         # punto de mira sobre el tramo, por delante de la proyección
  wind_limit_mps: 12.0         # resistencia al viento del DJI Matrice 300 RTK
  max_airspeed_mps: 17.0       # velocidad máxima en modo P (https://www.dji.com/matrice-300/info)

mission:
  id: MSN-DEMO
  waypoints:            # BASE = (0, 0) se añade al principio y al final
    - {id: WP1, x: 500.0, y: 1200.0}
    - {id: WP2, x: 1600.0, y: 1500.0}
    - {id: WP3, x: 2400.0, y: 800.0}
    - {id: WP4, x: 1900.0, y: -200.0}
  return_to_base: true

sensors:
  gps: {period_s: 1.0, sigma_m: 1.5, sats: 14, hdop: 0.8}
  radar: {period_s: 2.0, sigma_m: 5.0}
  meteo: {period_s: 10.0, sigma_mps: 0.5, sigma_deg: 8.0}
  link: {period_s: 5.0, controller_id: GCS-1, rssi_dbm: -62.0, latency_ms: 45.0}
  battery: {period_s: 10.0, start_pct: 100.0, drain_pct_per_min: 1.2}

wind:
  base: {speed_mps: 2.0, from_deg: 300.0}
  episodes:
    - {start_s: 125.0, end_s: 160.0, ramp_s: 10.0, speed_mps: 18.0, from_deg: 350.0}

spoofing:
  start_s: 198.0
  end_s: 252.0
  drift_rate_mps: 1.5
  direction_deg: 45.0
  emitter: {x: 1400.0, y: 1900.0, power_db: 12.0}   # emisor de engaño: sube el C/N0 y baja el AGC

hijack:
  start_s: 368.0
  end_s: 413.0
  target: {x: 1500.0, y: -1400.0}   # posición de la estación del secuestrador: el dron va allí

faults:                 # mute: la fuente no se publica; loss (solo GPS): el dron navega a estima. Inserta FaultInjected/FaultCleared
  - {source: meteo, mode: mute, start_s: 25.0, end_s: 900.0}   # hasta el final de la misión (se recorta al fin del vuelo)

# Simulador v2 (E7a): multirrotor con estimador a bordo, receptor GPS, radar con posición, estación en
# tierra, enlace con física, batería con consumo y emisores. Se eliminan al cerrar la E7a (paso 7b).
simulator:
  multirotor_guidance: true
  onboard_estimator: true
  gps_receiver: true
  radar_geometry: true
  ground_station: true
  link_physics: true
  battery_model: true
  emitters: true
