name: faults
description: >-
  Nominal mission with scheduled faults: the radar goes silent from T+02:00 to T+03:00; the GPS loses the signal from T+04:05 to T+04:50 (the drone navigates by dead reckoning with the last wind it estimated; the wind changes during the loss, so the estimate drifts) and goes silent from T+05:00 to T+05:12. Expected rules: SOURCE_SILENT (radar and GPS) and GPS_DEGRADED, SOURCE_DISCREPANCY and ROUTE_DEVIATION (loss); causes: SENSOR_FAULT and GPS_JAMMING.
seed: 42
t0: "2026-10-20T10:00:00Z"
max_duration_s: 900

drone:
  cruise_speed_mps: 15.0
  max_accel_mps2: 2.0
  max_turn_rate_dps: 100.0        # yaw máximo del DJI Matrice 300 RTK
  altitude_m: 60.0
  acceptance_radius_m: 5.0
  lookahead_m: 40.0         # punto de mira sobre el tramo, por delante de la proyección
  wind_limit_mps: 12.0         # resistencia al viento del DJI Matrice 300 RTK
  max_airspeed_mps: 17.0       # velocidad máxima en modo P (https://www.dji.com/matrice-300/info)

mission:
  id: MSN-FAULTS
  waypoints:            # BASE = (0, 0) se añade al principio y al final
    - {id: WP1, x: 500.0, y: 1200.0}
    - {id: WP2, x: 1600.0, y: 1500.0}
    - {id: WP3, x: 2400.0, y: 800.0}
    - {id: WP4, x: 1900.0, y: -200.0}
  return_to_base: true

sensors:
  gps: {period_s: 1.0, sigma_m: 1.5, sats: 14, hdop: 0.8}
  radar: {period_s: 2.0, sigma_m: 5.0}
  meteo: {period_s: 10.0, sigma_mps: 0.5, sigma_deg: 8.0}
  link: {period_s: 5.0, rssi_dbm: -62.0, latency_ms: 45.0}
  battery: {period_s: 10.0, start_pct: 100.0}

wind:
  base: {speed_mps: 2.0, from_deg: 300.0}
  episodes:
    - {start_s: 250.0, end_s: 300.0, ramp_s: 5.0, speed_mps: 12.0, from_deg: 0.0}   # cambia el viento durante la pérdida del GPS

spoofing: null

hijack: null

faults:                 # mute: la fuente no se publica; loss (solo GPS): el dron navega a estima. Inserta FaultInjected/FaultCleared
  - {source: radar, mode: mute, start_s: 120.0, end_s: 180.0}
  - {source: gps, mode: loss, start_s: 245.0, end_s: 290.0}   # tramo WP3→WP4, con el viento de base casi de costado
  - {source: gps, mode: mute, start_s: 300.0, end_s: 312.0}
