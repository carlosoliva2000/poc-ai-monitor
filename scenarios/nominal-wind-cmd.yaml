name: nominal-wind-cmd
description: >-
  nominal plus an instructor command (set_wind at T+01:35: 12 m/s from the north,
  60 s, 10 s ramp), like the wind episode of demo. Repeatable without the web or the LLM.
seed: 42
t0: "2026-10-20T10:00:00Z"
max_duration_s: 900

drone:
  cruise_speed_mps: 15.0
  max_accel_mps2: 2.0
  max_turn_rate_dps: 40.0
  altitude_m: 60.0
  acceptance_radius_m: 25.0
  lookahead_m: 40.0         # punto de mira sobre el tramo, por delante de la proyección

mission:
  id: MSN-NOMINAL
  waypoints:            # BASE = (0, 0) se añade al principio y al final
    - {id: WP1, x: 500.0, y: 1200.0}
    - {id: WP2, x: 1600.0, y: 1500.0}
    - {id: WP3, x: 2400.0, y: 800.0}
    - {id: WP4, x: 1900.0, y: -200.0}
  return_to_base: true

sensors:
  gps: {period_s: 1.0, sigma_m: 1.5, sats: 14, hdop: 0.8}
  radar: {period_s: 2.0, sigma_m: 5.0}
  meteo: {period_s: 10.0, sigma_mps: 0.5, sigma_deg: 8.0}
  link: {period_s: 5.0, controller_id: GCS-1, rssi_dbm: -62.0, latency_ms: 45.0}
  battery: {period_s: 10.0, start_pct: 100.0, drain_pct_per_min: 1.2}

wind:
  base: {speed_mps: 2.0, from_deg: 300.0}
  episodes: []

spoofing: null

hijack: null

faults: []              # fallos programados, mute o loss (ver README)

commands:               # comandos del instructor programados (v0.18)
  - at_s: 95.0
    command: set_wind
    params: {from_deg: 0.0, speed_mps: 12.0, ramp_s: 10.0, duration_s: 60.0}
