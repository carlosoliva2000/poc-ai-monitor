# Textos preparados del asistente (`assistant: scripted` en config.yaml).
#
# PROVISIONALES para el vídeo del 19/11/2026: sustituyen al LLM (E7d) en los escenarios `demo` y
# `nominal` (este, con las dos órdenes del instructor). Tienen que ser verdad para lo que se ve en
# esos dos escenarios: cifras redondas, sin instantes exactos ni ids internos. Para quitarlos
# basta con borrar este fichero, scripted.py y la clave `assistant`.

# Interpretación de cada transición del incidente: por tipo y estado.
enrich:
  WIND:
    open: >-
      The onboard wind estimate is above 17 m/s from the north, faster than the drone can fly.
      It cannot hold the route and is being pushed south of it; the deviation will grow while the
      wind lasts.
    recovering: >-
      The wind has dropped below what the drone can fly against, so it can hold the route again
      and is getting back to it on its own; no action is needed.
    closed: >-
      The drone is back on the route and the wind is calm again. The episode is over.
  GPS_SPOOFING:
    open: >-
      The GPS receiver shows the signature of a spoofer: the signal strength (C/N0) is well above
      its usual level while the receiver gain (AGC) drops. The GPS position still looks on the
      route, but it cannot be trusted: follow the drone with the radar.
    recovering: >-
      The false signal has gone: C/N0 and AGC are back to normal and the GPS agrees with the radar
      again. The drone had been led about 80 m off the route and is flying back to it.
    closed: >-
      The drone is back on the route and the GPS agrees with the radar again. The spoofing episode
      is over.
  LINK_LOSS:
    open: >-
      Our ground station has lost the command link and no telemetry arrives from the drone. The
      radar still sees it close to the route, so for now this looks like a link failure. Watch the
      radar track.
    recovering: >-
      The command link is back and telemetry arrives again. The drone is flying back to the route.
    closed: >-
      The link is stable and the drone is on the route. The episode is over.
  HIJACK:
    open: >-
      Still no link and no telemetry, and the radar now sees the drone leaving the route, more
      than a hundred metres away. With only a link failure the drone would keep flying our plan;
      instead it is flying away from it, so someone else is controlling it.
    recovering: >-
      Our command link is back and telemetry arrives again, but the drone is several hundred
      metres off the route. Watch that it turns back to the route under our control.
    closed: >-
      The drone is back on the route under our control. The hijack episode is over.
  UNDETERMINED:
    open: >-
      The drone is off the route and none of the known causes fits what the sensors show.
      Compare the GPS with the radar and check the wind and the link.
    recovering: >-
      The drone is getting back to the route; the cause is still unknown.
    closed: >-
      The drone is back on the route.

# Retraso de reloj de pared antes de publicar cada interpretación (la web muestra «pending…»).
delay_s: [2.0, 3.5]

# Escritura progresiva de las respuestas del chat.
chunk: {words: 3, interval_s: 0.05}
thinking_s: 0.8  # pausa antes de la primera palabra

chat:
  monitor:
    - question: "Why do you think the drone is being hijacked?"
      answer: |
        Three things together:

        - **Our command link is down.** Our ground station has lost the link and reports 100 % packet loss.
        - **No telemetry from the drone.** Since the link dropped, nothing arrives from the drone: no GPS, no autopilot, no battery.
        - **The radar sees it flying away.** The radar, which does not depend on the link, shows the drone heading south, more than 200 m off the route and still moving away.

        With only a link failure the drone would keep flying our plan, which is its failsafe. Instead it is leaving the route, so it is obeying someone else.

        **What to check:** the link at our ground station, the radar track of the drone, and warn the chain of command.
  fallback: "I could not answer that question. Try asking the question again."
  instructor:
    - question: "Put a strong wind from the north, 19 m/s, until I cancel it"
      proposal:
        command: set_wind
        params: {from_deg: 0.0, speed_mps: 19.0, ramp_s: 10.0, duration_s: null}
        defaults_used: [ramp_s]
      answer: "Wind from N (0°), 19 m/s, until cancelled, ramp 10 s. Filled in by default: ramp_s. Confirm it, edit it or discard it."
    - question: "Remove the wind"
      requires_active_wind: true
      proposal: {command: cancel_wind, params: null, defaults_used: []}
      answer: "Cancel the wind from the instructor. Confirm or discard it."
  instructor_fallback: "I could not answer that. Try saying it again."
  instructor_no_wind: "There is no instructor wind to cancel right now."

# Informe final, por escenario (solo los del vídeo). En otros escenarios no se publica informe.
report_delay_s: 4.0
report:
  demo: |
    # Mission report

    ## Summary
    The drone flew the planned route and returned to base. The situation monitor opened **three incidents**, one after another: a wind beyond the drone's limit, a GPS spoofing and a hijack. All three were closed before the end of the mission.

    ## What was seen
    ### 1 · Wind beyond limit (low)
    - A wind from the north above 17 m/s, faster than the drone can fly, pushed it south of the route, about 40 m at most.
    - When the wind dropped, the drone flew back on its own. It briefly overshot the route to the other side and then settled on it.

    ### 2 · GPS spoofing (high)
    - The GPS receiver showed the spoofing signature, C/N0 up by about 8 dB and AGC down by about 4 dB, **before the drone left the route**.
    - The false position led the drone about 80 m off the route. Only the radar could see it: the GPS still showed the drone on the route.
    - When the false signal stopped, the GPS jumped back to the real position and the drone returned to the route.

    ### 3 · Command link lost, then hijack (high)
    - Our ground station lost the command link and received no telemetry for about 45 s.
    - The incident opened as a lost link and was renamed hijack when the radar showed the drone leaving the route. The radar followed it south, up to about 650 m away.
    - When the link came back, the drone returned to the route under our control.

    ## Recommendations
    - Check the forecast against the drone's rated wind limit (12 m/s); above about 17 m/s it cannot hold the route at all.
    - When the GPS and the radar disagree, trust the radar and check C/N0 and AGC of the GPS receiver.
    - Review the protection of the command link and agree on what to do when the link is lost and the radar shows the drone leaving the route.
